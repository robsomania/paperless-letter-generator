<div class="row">
  <div class="col">
    <h2>Neuen Brief erstellen</h2>
  </div>
  <div class="col text-right">
    <button class="btn btn-primary" (click)="generatePdf()" [disabled]="!selectedTemplate || generating">
      {{ generating ? 'Generiere...' : 'Vorschau' }}
    </button>
    <button class="btn btn-success" (click)="sendToPaperless()"
      [disabled]="letterStatus !== 'generated' || sending">
      {{ sending ? 'Sende...' : 'An Paperless senden' }}
    </button>
  </div>
</div>

<div class="row mt-3">
  <div class="col-md-6">
    <div class="form-group">
      <label>Template</label>
      <select class="form-control" [(ngModel)]="selectedTemplate" (change)="onTemplateChange()">
        <option [ngValue]="null">-- Template wählen --</option>
        <option *ngFor="let t of templates" [ngValue]="t">{{ t.name }}</option>
      </select>
    </div>

    <div class="form-group">
      <label>Empfänger (aus Paperless)</label>
      <select class="form-control" [(ngModel)]="selectedCorrespondent" (change)="onCorrespondentChange()">
        <option [ngValue]="null">-- Korrespondent wählen --</option>
        <option *ngFor="let c of correspondents" [ngValue]="c">{{ c.name }}</option>
      </select>
    </div>

    <div class="form-group">
      <label>Quell-Dokument ID (für Antwort)</label>
      <div class="input-group">
        <input class="form-control" type="number" [(ngModel)]="sourceDocumentId" placeholder="z.B. 123" />
        <div class="input-group-append">
          <button class="btn btn-outline-secondary" (click)="fetchSourceDoc()">Laden</button>
        </div>
      </div>
    </div>

    <div class="card mb-3" *ngIf="sourceDoc">
      <div class="card-body py-2 small">
        <strong>Quell-Dokument:</strong> {{ sourceDoc.title }}<br />
        <span class="text-muted">vom {{ formatDate(sourceDoc.created) }}</span>
      </div>
    </div>

    <div class="card mb-3" *ngIf="!profile && selectedCorrespondent && addressFormVisible">
      <div class="card-body">
        <h6>Adresse für {{ selectedCorrespondent.name }}</h6>
        <div class="form-group">
          <label>Anrede (e/r)</label>
          <input class="form-control" [(ngModel)]="address.salutation" placeholder="r oder e" />
        </div>
        <div class="form-group">
          <label>Firma</label>
          <input class="form-control" [(ngModel)]="address.company" />
        </div>
        <div class="form-group">
          <label>Straße</label>
          <input class="form-control" [(ngModel)]="address.street" />
        </div>
        <div class="form-group">
          <label>PLZ Ort</label>
          <input class="form-control" [(ngModel)]="address.zip_city" />
        </div>
        <button class="btn btn-sm btn-primary" (click)="saveAddress()">Adresse speichern</button>
      </div>
    </div>

    <hr />

    <div class="form-group" *ngFor="let field of formFields">
      <label>
        {{ field.label }}
        <span *ngIf="field.required" class="text-danger">*</span>
      </label>
      <textarea *ngIf="field.type === 'textarea'" class="form-control" rows="4"
        [(ngModel)]="fieldValues[field.name]"></textarea>
      <input *ngIf="field.type !== 'textarea'" class="form-control"
        [type]="field.type === 'date' ? 'date' : 'text'"
        [(ngModel)]="fieldValues[field.name]" />
    </div>
  </div>

  <div class="col-md-6">
    <div *ngIf="generating" class="text-center text-muted py-5">
      Generiere PDF...
    </div>
    <div *ngIf="pdfError" class="alert alert-danger font-monospace small">
      {{ pdfError }}
    </div>
    <iframe *ngIf="pdfUrl" [src]="pdfUrl" class="w-100" style="height: 600px; border: 1px solid #ddd; border-radius: 4px;"></iframe>
  </div>
</div>
