<div class="row">
  <div class="col">
    <h2>Templates</h2>
  </div>
  <div class="col text-right">
    <a class="btn btn-primary" routerLink="/lettergen/templates/new">+ Neues Template</a>
  </div>
</div>

<div class="row mt-3" *ngIf="templates.length > 0">
  <div class="col-md-4 mb-3" *ngFor="let t of templates">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">{{ t.name }}</h5>
        <p class="card-text text-muted small">
          {{ t.description || 'Keine Beschreibung' }}
        </p>
        <p class="text-muted small">
          Variablen: {{ Object.keys(t.variable_config || {}).length }}
        </p>
        <div class="btn-group btn-group-sm">
          <a class="btn btn-outline-primary" [routerLink]="['/lettergen/templates', t.id]">Bearbeiten</a>
          <a class="btn btn-primary" [routerLink]="['/lettergen/compose']" [queryParams]="{ template: t.id }">Verwenden</a>
          <button class="btn btn-outline-danger" (click)="confirmDelete(t)">Löschen</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div *ngIf="templates.length === 0" class="mt-4 text-center text-muted">
  <p>Keine Templates vorhanden.</p>
  <a class="btn btn-primary" routerLink="/lettergen/templates/new">Erstes Template erstellen</a>
</div>
