<div class="row">
  <div class="col">
    <h2>Briefe</h2>
  </div>
  <div class="col text-right">
    <a class="btn btn-primary" routerLink="/lettergen/compose">+ Neuer Brief</a>
  </div>
</div>

<table class="table table-hover mt-3" *ngIf="letters.length > 0">
  <thead>
    <tr>
      <th>ID</th>
      <th>Template</th>
      <th>Empfänger</th>
      <th>Status</th>
      <th>Erstellt</th>
      <th>Aktionen</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let l of letters">
      <td>{{ l.id }}</td>
      <td>{{ l.template_name }}</td>
      <td>{{ l.correspondent_name || '-' }}</td>
      <td>
        <span class="badge" [ngClass]="{
          'badge-warning': l.status === 'draft',
          'badge-info': l.status === 'generated',
          'badge-success': l.status === 'sent'
        }">{{ statusLabel(l.status) }}</span>
      </td>
      <td>{{ formatDate(l.created_at) }}</td>
      <td>
        <div class="btn-group btn-group-sm">
          <button *ngIf="l.status === 'draft'" class="btn btn-primary" (click)="regenerate(l.id)">Generieren</button>
          <button *ngIf="l.status === 'generated'" class="btn btn-outline-primary" (click)="downloadPdf(l.id)">PDF</button>
          <button *ngIf="l.status === 'generated'" class="btn btn-success" (click)="sendLetter(l.id)">Senden</button>
          <button class="btn btn-outline-danger" (click)="deleteLetter(l.id)">Löschen</button>
        </div>
      </td>
    </tr>
  </tbody>
</table>

<p *ngIf="letters.length === 0" class="mt-4 text-center text-muted">
  Noch keine Briefe erstellt.
  <a routerLink="/lettergen/compose">Ersten Brief erstellen</a>.
</p>
