<div class="row">
  <div class="col">
    <h2>{{ isNew ? 'Neues Template' : 'Template bearbeiten' }}</h2>
  </div>
  <div class="col text-right">
    <button class="btn btn-primary" (click)="save()" [disabled]="saving">
      {{ saving ? 'Speichere...' : 'Speichern' }}
    </button>
    <a class="btn btn-outline-secondary" routerLink="/lettergen/templates">Abbrechen</a>
  </div>
</div>

<div class="row mt-3">
  <div class="col-md-6">
    <div class="form-group">
      <label>Name</label>
      <input class="form-control" [(ngModel)]="name" placeholder="z.B. Formeller Geschäftsbrief" />
    </div>
    <div class="form-group">
      <label>Beschreibung</label>
      <input class="form-control" [(ngModel)]="description" placeholder="Kurze Beschreibung" />
    </div>
    <div class="form-group">
      <label>LaTeX Quelltext</label>
      <textarea class="form-control font-monospace" rows="20"
        [(ngModel)]="latexSource" (input)="onSourceChange()"
        placeholder="% LaTeX mit {{ '{{ var_name }}' }} Platzhaltern"></textarea>
    </div>
  </div>
  <div class="col-md-6">
    <div class="card">
      <div class="card-header">Variablen konfigurieren</div>
      <div class="card-body p-0">
        <table class="table table-sm mb-0">
          <thead>
            <tr>
              <th>Variable</th>
              <th>Label</th>
              <th>Typ</th>
              <th class="text-center">Pflicht</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let v of variables">
              <td><code>{{ v.name }}</code></td>
              <td><input class="form-control form-control-sm" [(ngModel)]="v.label" /></td>
              <td>
                <select class="form-control form-control-sm" [(ngModel)]="v.type">
                  <option value="text">Text</option>
                  <option value="textarea">Textarea</option>
                  <option value="date">Datum</option>
                </select>
              </td>
              <td class="text-center">
                <input type="checkbox" [(ngModel)]="v.required" />
              </td>
            </tr>
            <tr *ngIf="variables.length === 0">
              <td colspan="4" class="text-muted text-center">
                Keine Variablen gefunden. Verwende <code>{{ '{{ var_name }}' }}</code> im Quelltext.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
